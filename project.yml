name: AutoNote
options:
  bundleIdPrefix: com.autonote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  AutoNote:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AutoNote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Чтобы сфотографировать чек и записать расход."
        NSMicrophoneUsageDescription: "Чтобы записать расход голосом."
        NSSpeechRecognitionUsageDescription: "Чтобы превратить твой голос в запись расхода."
        NSPhotoLibraryUsageDescription: "Чтобы выбрать фото чека из галереи."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autonote.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
